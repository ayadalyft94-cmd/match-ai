<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090b10">
<title>أوراق اليوم والسجل · نسخة متكاملة</title>
<style>
:root{
  --bg:#090b10;
  --card:#12151d;
  --card-2:#181c26;
  --line:rgba(255,255,255,.09);
  --text:#f3f4f6;
  --muted:#9ca3af;
  --red:#e11d48;
  --red-soft:rgba(225,29,72,.16);
  --green:#22c55e;
  --green-soft:rgba(34,197,94,.15);
  --blue:#38bdf8;
  --blue-soft:rgba(56,189,248,.15);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Arial,sans-serif;
  line-height:1.55;
  min-height:100vh;
}
header{
  position:sticky;top:0;z-index:20;
  background:rgba(11,13,19,.96);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:10px 14px;
}
.head-in{
  max-width:680px;margin:auto;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px}
.pill-live{
  background:var(--red);color:#fff;font-size:11px;font-weight:800;
  padding:3px 9px;border-radius:8px;
}
.nav-row{
  max-width:680px;margin:8px auto 0;
  display:flex;gap:8px;
}
button,select,input{font:inherit}
button{cursor:pointer}
.nav-btn{
  flex:1;border:1px solid var(--line);background:var(--card);color:var(--text);
  padding:8px 10px;border-radius:9px;font-size:13px;font-weight:700;
}
.nav-btn.active{background:var(--red);border-color:var(--red);color:#fff}
main{max-width:680px;margin:auto;padding:14px}
section{display:none}
section.active{display:block}

.panel{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin-bottom:14px;
}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:12px}
.field{
  background:var(--card-2);color:var(--text);border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;font-size:13px;
}
.btn{
  border:1px solid var(--line);background:var(--card-2);color:var(--text);
  border-radius:8px;padding:7px 12px;font-size:13px;font-weight:700;
}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#052e16}

/* بطاقة ورقة بأسلوب الصورة الأولى */
.ticket-card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:15px;margin-bottom:14px;
}
.ticket-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ticket-num{font-weight:900;font-size:16px}
.badge-wait{
  background:rgba(255,255,255,.07);color:#e5e7eb;border:1px solid var(--line);
  padding:3px 9px;border-radius:7px;font-size:11px;font-weight:700;
}
.badge-lock{
  background:rgba(255,255,255,.04);color:var(--muted);border:1px solid var(--line);
  padding:3px 9px;border-radius:7px;font-size:11px;
}
.badge-open{
  background:var(--blue-soft);color:#7dd3fc;border:1px solid rgba(56,189,248,.35);
  padding:3px 9px;border-radius:7px;font-size:11px;font-weight:700;
}
.meta-strip{
  display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;
  margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
  font-size:12px;color:var(--muted);
}
.match-box{
  background:var(--card-2);border:1px solid var(--line);border-radius:11px;
  padding:12px;margin-top:12px;
}
.teams-line{font-size:16px;font-weight:800}
.league-line{font-size:12px;color:var(--muted);margin-top:2px}
.pick-row{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
}
.pick-name{font-size:15px;font-weight:800}
.odd-pill{
  background:#111622;border:1px solid rgba(255,255,255,.16);
  border-radius:8px;padding:6px 12px;font-size:16px;font-weight:900;
}
.ticket-foot{
  display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
  margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;
}

/* لوحة السجل والأداء بأسلوب الصورة الثانية */
.profit-big{font-size:36px;font-weight:900;margin:6px 0;color:var(--green)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.stat-box{background:var(--card-2);border:1px solid var(--line);border-radius:11px;padding:12px}
.stat-lbl
