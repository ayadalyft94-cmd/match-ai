<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070c16">
<title>MATCH AI — مساعد التوقعات وأودز السوق (1.20 - 2.50)</title>
<style>
:root{
--bg:#070c16;--card:rgba(16,26,45,.92);
--line:rgba(148,163,184,.17);--text:#f1f5f9;
--muted:#94a3b8;--green:#34d399;--blue:#38bdf8;
--gold:#fbbf24;--red:#fb7185
}
*{box-sizing:border-box}
body{
margin:0;background:radial-gradient(circle at 15% 0%,#11233b 0%,#070c16 55%,#050811 100%);
color:var(--text);font-family:system-ui,Arial,sans-serif;line-height:1.55;min-height:100vh
}
header{background:rgba(10,18,32,.94);border-bottom:1px solid var(--line);padding:14px 16px}
.head{max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-size:23px;font-weight:900;background:linear-gradient(90deg,var(--green),var(--blue));-webkit-background-clip:text;color:transparent}
.sub,.muted{font-size:12px;color:var(--muted)}
nav{display:flex;gap:7px;padding:10px 12px;overflow:auto;background:#080e1a;border-bottom:1px solid var(--line)}
button,select,input{font:inherit}
button{cursor:pointer}
nav button,.btn,.chip{
border:1px solid var(--line);border-radius:10px;padding:8px 12px;
background:#17243d;color:#e2e8f0;font-size:13px;white-space:nowrap
}
nav button.active,.btn.primary,.chip.active{
background:linear-gradient(135deg,#10b981,#059669);color:#041c14;
border-color:var(--green);font-weight:800
}
.btn{display:inline-block}.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.blue{background:#12324a;color:#7dd3fc}
.btn.gold{background:#382d12;color:#fde68a}
main{max-width:1050px;margin:auto;padding:15px}
section{display:none}section.active{display:block}
h2{font-size:19px;margin:5px 0 12px}h3{font-size:15px;margin:0}
.box{
background:var(--card);border:1px solid var(--line);border-radius:14px;
padding:14px;margin-bottom:12px;box-shadow:0 8px 22px #0003
}
.highlight{border-color:#34d39966}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.grid2,.grid3{display:grid;gap:9px;grid-template-columns:1fr}
@media(min-width:700px){
.grid2{grid-template-columns:1fr 1fr}
.grid3{grid-template-columns:repeat(3,1fr)}
}
.stat{background:#182642;border:1px solid var(--line);border-radius:11px;padding:10px;text-align:center;font-size:12px}
.stat b{display:block;color:var(--gold);font-size:18px;margin-top:3px}
.pill{display:inline-block;border-radius:99px;padding:3px 9px;background:#12324a;color:#7dd3fc;font-size:11px;border:1px solid #38bdf844}
.pill.gold{background:#382d12;color:#fde68a;border-color:#fbbf2455}
.pill.ok{background:#12372d;color:#6ee7b7;border-color:#34d39955}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 0;border-top:1px solid var(--line)}
.match-title{text-align:center;font-size:17px;font-weight:850;margin:10px 0}
.green{color:var(--green)}.goldtext{color:var(--gold)}.red{color:var(--red)}
.field{width:100%;margin-top:4px;padding:9px 11px;border-radius:10px;background:#182642;color:white;border:1px solid #64748b55}
.field:focus{outline:1px solid var(--green)}
.full{width:100%;margin-top:8px}
.toast{position:fixed;bottom:15px;left:15px;right:15px;max-width:430px;margin:auto;background:#0f293a;border:1px solid var(--green);padding:11px 14px;border-radius:10px;display:none;z-index:99}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
th,td{padding:8px;border:1px solid var(--line);text-align:center}
th{background:#182642}
.notice{border:1px solid #fbbf2455;background:#302710;color:#fde68a;padding:10px;border-radius:10px;font-size:12px;margin:9px 0}
.empty{padding:16px;text-align:center;color:var(--muted)}
footer{text-align:center;color:#64748b;padding:18px;font-size:11px}
.pick-badge{background:#12372d;border:1px solid #34d39955;border-radius:10px;padding:10px;margin-top:8px}
</style>
</head>
<body>

<header>
<div class="head">
<div>
<div class="logo">MATCH AI</div>
<div class="sub">مباريات اليوم تلقائياً • أودز سوق حقيقية (1.20 – 2.50) • خيارات متعددة</div>
</div>
<div id="todayLabel" class="pill gold">تاريخ اليوم: —</div>
</div>
</header>

<nav>
<button class="active" onclick="openTab('picksTab',this)">ترشيحات اليوم (1.20 - 2.50)</button>
<button onclick="openTab('allTab',this)">كل مباريات اليوم</button>
<button onclick="openTab('detailsTab',this)">خيارات المباراة</button>
<button onclick="openTab('couponTab',this)">قسيمتي</button>
</nav>

<main>

<section id="picksTab" class="active">
<div class="box">
<div class="row">
<b>أفضل الخيارات المنطقية بأودز سوق بين 1.20 و 2.50</b>
<span id="statusPill" class="pill">جاري التحميل...</span>
</div>
<div class="grid2" style="margin-top:10px">
<div>
<label class="muted">نطاق الأودز المطلوب</label>
<select id="oddRangeFilter" class="field" onchange="renderPicks()">
<option value="1.20-2.50">من 1.20 إلى 2.50 (الموصى به)</option>
<option value="1.25-2.00">من 1.25 إلى 2.00 (أكثر أماناً)</option>
<option value="1.60-2.50">من 1.60 إلى 2.50 (أودز أعلى)</option>
</select>
</div>
<div>
<label class="muted">بحث عن فريق أو بطولة</label>
<input id="searchPicks" class="field" placeholder="مثال: Arsenal أو Premier..." oninput="renderPicks()">
</div>
</div>
<div class="row" style="margin-top:10px">
<span class="muted" id="picksSummary">—</span>
<button class="btn primary sm" onclick="loadTodayOdds(true)">تحديث أودز اليوم</button>
</div>
</div>
<div id="picksList"></div>
</section>

<section id="allTab">
<div class="box">
<div class="row">
<b>جميع مباريات اليوم المتاحة بالأودز</b>
<button class="btn gold sm" onclick="loadTodayOdds(true)">إعادة جلب الأودز</button>
</div>
<input id="searchAll" class="field" style="margin-top:10px" placeholder="ابحث باسم فريق أو بطولة..." oninput="renderAllMatches()">
</div>
<div id="allMatchesList"></div>
</section>

<section id="detailsTab">
<div class="box">
<label class="muted">اختر مباراة لعرض كافة خيارات الأودز المتاحة</label>
<select id="matchSelector" class="field" onchange="renderMatchDetails()"></select>
<div id="matchDetailsBox" style="margin-top:12px"></div>
</div>
</section>

<section id="couponTab">
<div class="box highlight">
<div class="row">
<h3>قسيمة الاختيارات المحددة</h3>
<button class="btn sm" onclick="clearCoupon()">مسح الكل</button>
</div>
<div id="couponBox" style="margin-top:8px"></div>
</div>
</section>

</main>

<div id="toast" class="toast"></div>
<footer>MATCH AI • أودز السوق الحقيقية عبر OddsPapi • تحديث يومي تلقائي</footer>

<script>
"use strict";

const WORKER = "https://billowing-meadow-a8c8.ayadalyft94.workers.dev";
const MIN_ODD = 1.20;
const MAX_ODD = 2.50;

let matchesWithOdds = [];
let selectedPicks = new Map();
let loading = false;

const $ = id => document.getElementById(id);

function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { el.style.display = "none"; }, 2800);
}

function safe(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function todayDateStr() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Africa/Algiers", year: "numeric", month: "2-digit", day: "2-digit"
  }).formatToParts(new Date());
  const y = parts.find(p => p.type === "year").value;
  const m = parts.find(p => p.type === "month").value;
  const d = parts.find(p => p.type === "day").value;
  return `${y}-${m}-${d}`;
}

function openTab(id, btn) {
  document.querySelectorAll("main section").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  if (btn) btn.classList.add("active");
  if (id === "picksTab") renderPicks();
  if (id === "allTab") renderAllMatches();
  if (id === "detailsTab") renderMatchDetails();
  if (id === "couponTab") renderCoupon();
}

function marketLabelFromId(marketId, outcomeId, homeName, awayName) {
  const m = String(marketId);
  const o = String(outcomeId);
  if (m === "101") {
    if (o === "101") return `فوز المضيف (${homeName})`;
    if (o === "102") return "تعادل (X)";
    if (o === "103") return `فوز الضيف (${awayName})`;
  }
  if (m === "104") return `إجمالي الأهداف (سوق ${m} - خيار ${o})`;
  return `سوق ${m} — خيار ${o}`;
}

function extractBookmakerOptions(oddsPayload, homeName, awayName) {
  const options = [];
  const bookmakers = oddsPayload?.bookmakerOdds;
  if (!bookmakers || typeof bookmakers !== "object") return options;

  for (const [bookieName, bookieData] of Object.entries(bookmakers)) {
    if (!bookieData || bookieData.bookmakerIsActive === false) continue;
    const markets = bookieData.markets;
    if (!markets || typeof markets !== "object") continue;

    for (const [marketId, marketObj] of Object.entries(markets)) {
      if (!marketObj || marketObj.marketActive === false) continue;
      const outcomes = marketObj.outcomes;
      if (!outcomes || typeof outcomes !== "object") continue;

      for (const [outcomeId, outcomeObj] of Object.entries(outcomes)) {
        const players = outcomeObj?.players;
        if (!players || typeof players !== "object") continue;

        for (const playerObj of Object.values(players)) {
          if (!playerObj || playerObj.active === false) continue;
          const price = Number(playerObj.price);
          if (!Number.isFinite(price) || price <= 1) continue;

          const impliedProb = 1 / price;
          options.push({
            bookie: bookieName,
            marketId,
            outcomeId,
            label: marketLabelFromId(marketId, outcomeId, homeName, awayName),
            odd: price,
            impliedProb
          });
        }
      }
    }
  }
  return options;
}

function pickBestLogicalOption(options, minOdd = MIN_ODD, maxOdd = MAX_ODD) {
  const ranged = options.filter(opt => opt.odd >= minOdd && opt.odd <= maxOdd);
  if (!ranged.length) return null;
  // نفضل الأودز المعقولة ذات الاحتمال الضمني الجيد والمتوازن ضمن النطاق المطلوب
  ranged.sort((a, b) => b.impliedProb - a.impliedProb);
  return ranged[0];
}

async function mapLimit(items, limit, fn) {
  let idx = 0;
  const workers = Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (idx < items.length) {
      const i = idx++;
      await fn(items[i]);
    }
  });
  await Promise.all(workers);
}

async function loadTodayOdds(manual = false) {
  if (loading) return;
  loading = true;
  const today = todayDateStr();
  $("todayLabel").textContent = `تاريخ اليوم: ${today}`;
  $("statusPill").textContent = "جاري جلب مباريات وأودز اليوم...";

  try {
    const fxRes = await fetch(`${WORKER}/op/fixtures?sportId=10&date=${encodeURIComponent(today)}`, { cache: "no-store" });
    if (!fxRes.ok) throw new Error("HTTP " + fxRes.status);
    const fxData = await fxRes.json();
    const list = Array.isArray(fxData) ? fxData : (fxData?.data || fxData?.fixtures || []);

    const candidates = list
      .filter(f => f && f.fixtureId && f.hasOdds !== false && f.statusId !== 2)
      .slice(0, 35);

    const results = [];
    await mapLimit(candidates, 4, async f => {
      try {
        const oddRes = await fetch(`${WORKER}/op/odds?fixtureId=${encodeURIComponent(f.fixtureId)}`, { cache: "no-store" });
        if (!oddRes.ok) return;
        const oddData = await oddRes.json();
        const home = f.participant1Name || f.participant1ShortName || "المضيف";
        const away = f.participant2Name || f.participant2ShortName || "الضيف";
        const league = f.tournamentName || f.categoryName || "بطولة";
        const timeStr = f.startTime ? String(f.startTime).slice(11, 16) : "";

        const options = extractBookmakerOptions(oddData, home, away);
        if (!options.length) return;

        results.push({
          fixtureId: f.fixtureId,
          home,
          away,
          league,
          time: timeStr,
          options
        });
      } catch (e) {}
    });

    matchesWithOdds = results;
    $("statusPill").textContent = `${matchesWithOdds.length} مباراة بأودز حقيقية`;
    populateMatchSelector();
    renderPicks();
    renderAllMatches();
    renderCoupon();

    if (manual) {
      toast(matchesWithOdds.length ? `تم تحديث الأودز لـ ${matchesWithOdds.length} مباراة` : "لم تتوفر أودز نشطة حالياً");
    }
  } catch (err) {
    $("statusPill").textContent = "خطأ في الجلب";
    if (manual) toast("تعذر جلب البيانات: " + err.message);
  } finally {
    loading = false;
  }
}

function getSelectedRange() {
  const val = $("oddRangeFilter").value;
  const [min, max] = val.split("-").map(Number);
  return { min: min || MIN_ODD, max: max || MAX_ODD };
}

function renderPicks() {
  const { min, max } = getSelectedRange();
  const q = ($("searchPicks").value || "").trim().toLowerCase();

  const items = [];
  for (const m of matchesWithOdds) {
    const matchText = `${m.home} ${m.away} ${m.league}`.toLowerCase();
    if (q && !matchText.includes(q)) continue;
    const best = pickBestLogicalOption(m.options, min, max);
    if (best) {
      items.push({ match: m, pick: best });
    }
  }

  $("picksSummary").textContent = `${items.length} ترشيح ضمن نطاق الأودز ${min.toFixed(2)} - ${max.toFixed(2)}`;

  if (!items.length) {
    $("picksList").innerHTML = `<div class="box empty">لا توجد خيارات حالياً ضمن نطاق الأودز ${min.toFixed(2)} - ${max.toFixed(2)}. جرّب نطاقاً آخر أو حدّث البيانات.</div>`;
    return;
  }

  $("picksList").innerHTML = items.map(({ match, pick }) => {
    const key = `${match.fixtureId}|${pick.bookie}|${pick.marketId}|${pick.outcomeId}`;
    const isAdded = selectedPicks.has(key);
    return `
      <div class="box highlight">
        <div class="row">
          <span class="pill">${safe(match.league)}</span>
          <span class="muted">${safe(match.time)} • ${safe(pick.bookie)}</span>
        </div>
        <div class="match-title">${safe(match.home)} × ${safe(match.away)}</div>
        <div class="pick-badge">
          <div class="row">
            <b class="green">${safe(pick.label)}</b>
            <span class="pill gold">أودز السوق: ${pick.odd.toFixed(2)}</span>
          </div>
          <div class="muted" style="margin-top:4px">احتمال ضمني تقريبي: ${(pick.impliedProb * 100).toFixed(1)}%</div>
        </div>
        <div class="row" style="margin-top:10px">
          <button class="btn blue sm" onclick="openMatchDetails('${safe(match.fixtureId)}')">كل الخيارات</button>
          <button class="btn primary sm" onclick="toggleCouponPick('${safe(key)}','${safe(match.home)}','${safe(match.away)}','${safe(pick.label)}',${pick.odd},'${safe(pick.bookie)}')">
            ${isAdded ? "إزالة من القسيمة" : "إضافة للقسيمة"}
          </button>
        </div>
      </div>`;
  }).join("");
}

function renderAllMatches() {
  const q = ($("searchAll").value || "").trim().toLowerCase();
  const filtered = matchesWithOdds.filter(m =>
    !q || `${m.home} ${m.away} ${m.league}`.toLowerCase().includes(q)
  );

  if (!filtered.length) {
    $("allMatchesList").innerHTML = `<div class="box empty">لا توجد مباريات معروضة حالياً.</div>`;
    return;
  }

  $("allMatchesList").innerHTML = filtered.map(m => {
    const best = pickBestLogicalOption(m.options, MIN_ODD, MAX_ODD);
    return `
      <div class="box">
        <div class="row">
          <span class="pill">${safe(m.league)}</span>
          <span class="muted">${safe(m.time)} • ${m.options.length} خيار أودز</span>
        </div>
        <div class="match-title">${safe(m.home)} × ${safe(m.away)}</div>
        <div class="line">
          <span>${best ? `<b class="green">${safe(best.label)}</b>` : `<span class="muted">لا يوجد خيار بين 1.20 و 2.50</span>`}</span>
          <span>${best ? `<b class="goldtext">${best.odd.toFixed(2)}</b>` : "—"}</span>
        </div>
        <button class="btn blue sm" onclick="openMatchDetails('${safe(m.fixtureId)}')">عرض كافة الخيارات</button>
      </div>`;
  }).join("");
}

function populateMatchSelector() {
  $("matchSelector").innerHTML = matchesWithOdds.length
    ? matchesWithOdds.map(m => `<option value="${safe(m.fixtureId)}">${safe(m.home)} × ${safe(m.away)} (${safe(m.league)})</option>`).join("")
    : `<option value="">لا توجد مباريات</option>`;
  renderMatchDetails();
}

function openMatchDetails(fixtureId) {
  $("matchSelector").value = fixtureId;
  openTab("detailsTab", document.querySelectorAll("nav button")[2]);
}

function renderMatchDetails() {
  const fid = $("matchSelector").value;
  const m = matchesWithOdds.find(x => x.fixtureId === fid);
  if (!m) {
    $("matchDetailsBox").innerHTML = `<div class="empty">اختر مباراة لعرض خياراتها.</div>`;
    return;
  }

  const inRange = m.options.filter(o => o.odd >= MIN_ODD && o.odd <= MAX_ODD);
  $("matchDetailsBox").innerHTML = `
    <div class="match-title">${safe(m.home)} × ${safe(m.away)}</div>
    <div class="muted" style="text-align:center">${safe(m.league)} • ${safe(m.time)}</div>
    <table>
      <thead>
        <tr>
          <th>البوكي</th>
          <th>الخيار / السوق</th>
          <th>الأودز</th>
          <th>الحالة للنطاق (1.20-2.50)</th>
        </tr>
      </thead>
      <tbody>
        ${m.options.slice(0, 30).map(o => {
          const ok = o.odd >= MIN_ODD && o.odd <= MAX_ODD;
          return `
            <tr>
              <td>${safe(o.bookie)}</td>
              <td>${safe(o.label)}</td>
              <td class="${ok ? "goldtext" : "muted"}"><b>${o.odd.toFixed(2)}</b></td>
              <td>${ok ? `<span class="green">ضمن النطاق</span>` : `<span class="muted">خارج النطاق</span>`}</td>
            </tr>`;
        }).join("")}
      </tbody>
    </table>
    <div class="muted" style="margin-top:8px">إجمالي الخيارات ضمن 1.20 - 2.50 لهذه المباراة: ${inRange.length}</div>
  `;
}

function toggleCouponPick(key, home, away, label, odd, bookie) {
  if (selectedPicks.has(key)) {
    selectedPicks.delete(key);
    toast("تمت الإزالة من القسيمة");
  } else {
    selectedPicks.set(key, { key, home, away, label, odd: Number(odd), bookie });
    toast("تمت الإضافة للقسيمة");
  }
  renderPicks();
  renderCoupon();
}

function clearCoupon() {
  selectedPicks.clear();
  renderPicks();
  renderCoupon();
}

function renderCoupon() {
  const list = Array.from(selectedPicks.values());
  if (!list.length) {
    $("couponBox").innerHTML = `<div class="empty">لم تقم بإضافة أي خيارات إلى القسيمة بعد.</div>`;
    return;
  }
  const totalOdd = list.reduce((acc, item) => acc * item.odd, 1);
  $("couponBox").innerHTML = list.map(item => `
    <div class="line">
      <div>
        <b>${safe(item.home)} × ${safe(item.away)}</b><br>
        <span class="muted">${safe(item.label)} • ${safe(item.bookie)}</span>
      </div>
      <b class="goldtext">${item.odd.toFixed(2)}</b>
    </div>
  `).join("") + `
    <div class="line">
      <b>مجموع الأودز التقريبي للقسيمة</b>
      <b class="green">${totalOdd.toFixed(2)}</b>
    </div>
  `;
}

$("todayLabel").textContent = `تاريخ اليوم: ${todayDateStr()}`;
loadTodayOdds(false);
</script>
</body>
</html>
